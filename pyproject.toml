[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctres-validator-lite"
version = "1.0.0"
description = "Structural and Referential validation (§11) of CTRES v1.0 packages"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]
authors = [{ name = "CTRES contributors", email = "hello@ctres.org" }]
keywords = ["CTRES", "validation", "JSON Schema", "gambling regulation", "payments", "evidence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://ctres.org/validator/"
Source = "https://github.com/ctres-standard/validator-lite"
Issues = "https://github.com/ctres-standard/validator-lite/issues"
Schema = "https://github.com/ctres-standard/schema"

[project.scripts]
ctres-validate = "ctres_validator_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctres_validator_lite = ["schema/*.schema.json", "schema/records/*.schema.json"]
