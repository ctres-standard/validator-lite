name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validator-lite
        run: python -m pip install .
      - name: Run the tests
        run: python -m unittest discover -s tests -v
      - name: Validate the demonstration packages
        run: |
          ctres-validate demo/clean
          if ctres-validate demo/defects; then echo "demo/defects passed, but must fail"; exit 1; fi
